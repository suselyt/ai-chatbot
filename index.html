<html>

<head>
    <title>Programming Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body class="flex flex-col h-screen bg-gray-900">
    <div id="header" class="flex justify-between py-4 px-5 text-white">
        <h1 class="text-lg font-semibold"><i class="fa-solid fa-code"></i> Ask Chat anything!</h1>
        <button onclick="restartChat()" title="Restart conversation" aria-label="Restart conversation"
            class="cursor-pointer px-2 py-1 border border-gray-600 rounded-sm text-sm"><i
                class="fa-solid fa-arrow-rotate-right"></i> Restart</button>
        <!-- TO DO: add a dark and light theme switch -->
    </div>

    <div class="flex-1 overflow-y-auto flex flex-col">
        <div id="chatWindow" class="flex-1 p-4 w-3/5 mx-auto text-white flex flex-col">
            <div id="welcome-section"
                class="flex-1 flex flex-col items-center justify-center text-center max-w-md mx-auto gap-4">
                <i class="fa-solid fa-robot text-6xl text-pink-300"></i>
                <h2 class="text-2xl font-semibold">Chat-code</h2>
                <p class="text-gray-400 text-base leading-relaxed">Hi, I'm Chat-code your personal assistant to help you
                    understand basic programming topics. Send me a question and I'll try to explain it in really simple
                    terms!</p>
            </div>
        </div>
    </div>

    <div id="inputFooter" class="flex py-6 px-5 place-content-center gap-4">
        <textarea id="userInput" aria-label="Message input" placeholder="Write your message" rows="1"
            class="rounded-2xl bg-gray-700 text-white px-4 py-2 w-3/5 resize-none overflow-hidden max-h-24"></textarea>
        <button id="sendButton" title="Send message" aria-label="Send message" disabled onclick="sendMessage()"
            class="disabled:opacity-50 focus:ring-2 bg-white cursor-pointer rounded-full p-3"><i
                class="fa-solid fa-paper-plane"></i></button>
    </div>

    <script>
        async function sendMessage() {
            scrollToBottom()
            const input = document.getElementById("userInput")
            const message = input.value
            const chatWindow = document.getElementById("chatWindow")
            const sendButton = document.getElementById("sendButton")
            const welcomeSection = document.getElementById("welcome-section")           // hide the welcome section
            if (welcomeSection) {
                welcomeSection.remove()
            }

            if (!message.trim()) {
                showToast("Please write a message first", "warning")
                return
            }

            sendButton.disabled = true;                              // disables to send more messages
            const userMsg = document.createElement("div")            // user message
            userMsg.classList.add("flex", "justify-end", "mb-4")
            userMsg.innerHTML = `
                    <div class="max-w-xs lg:max-w-md">
                        <div class="flex items-center justify-end gap-2 mb-1">
                            <span class="text-xs text-gray-400">${getTime()}</span>
                            <span class="text-sm font-semibold">You</span>
                            <i class="fa-solid fa-user text-sm"></i>
                        </div>
                        <div class="bg-pink-400 text-white rounded-2xl rounded-tr-none px-4 py-2">
                            ${message}
                        </div>
                    </div>`
            chatWindow.appendChild(userMsg)

            input.value = ""                                         // clear input

            const aiMsg = document.createElement("div")              // AI message
            aiMsg.classList.add("flex", "justify-start", "mb-4")
            const bubble = document.createElement("div")  // separate variable so you can append chunks
            bubble.classList.add(                         // added class for better static version
                "chat-bubble",
                "bg-gray-700",
                "text-white",
                "rounded-2xl",
                "rounded-tl-none",
                "px-4",
                "py-2",
                "max-w-xs",
                "lg:max-w-md"
            );
            bubble.classList.add("bg-gray-700", "text-white", "rounded-2xl", "rounded-tl-none", "px-4", "py-2", "max-w-xs", "lg:max-w-md")
            aiMsg.innerHTML = `
                    <div class="max-w-xs lg:max-w-md">
                        <div class="flex items-center gap-2 mb-1">
                            <i class="fa-solid fa-robot text-sm"></i>
                            <span class="text-sm font-semibold">Chat-code</span>
                            <span class="text-xs text-gray-400">${getTime()}</span>
                        </div>
                    </div>`
            aiMsg.firstElementChild.appendChild(bubble)
            chatWindow.appendChild(aiMsg)

            const typingIndicator = document.createElement("div")           // while the ai is answering
            typingIndicator.id = "typingIndicator"
            typingIndicator.classList.add("flex", "gap-1", "items-center", "py-1")
            typingIndicator.innerHTML = `
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>`
            bubble.appendChild(typingIndicator)

            try {
                // Remove the typing indicator after a short delay
                await new Promise(resolve => setTimeout(resolve, 1000));

                const indicator = document.getElementById("typingIndicator");
                if (indicator) indicator.remove();

                const demoResponse = `# Demo Mode

Thank you for checking out this project!


This public version has the AI responses **disabled** to avoid unnecessary API costs.


### This chatbot normally includes:

- OpenAI API integration
- FastAPI backend
- Real-time streaming responses
- Conversation history
- Token usage tracking
- Markdown support


If you'd like to see how it works, please visit the [GitHub repository](https://github.com/suselyt/ai-chatbot) where you can explore the complete source code and architecture.


> **Note:** The full version communicates with the OpenAI API to generate responses in real time.
`;

                let currentText = "";

                // simulate streaming one character at a time
                for (const char of demoResponse) {
                    currentText += char;
                    bubble.innerHTML = marked.parse(currentText);
                    bubble.querySelectorAll("a").forEach(link => {
                        link.target = "_blank";
                        link.rel = "noopener noreferrer";
                    });
                    scrollToBottom();
                    await new Promise(resolve => setTimeout(resolve, 15));
                }

                // fake token usage
                const tokenToggle = document.createElement("details");
                tokenToggle.classList.add("text-xs", "text-gray-400", "mt-1", "cursor-pointer");

                tokenToggle.innerHTML = `
        <summary class="list-none flex items-center gap-1 hover:text-gray-300">
            <i class="fa-solid fa-ellipsis text-xs"></i> Demo Information
        </summary>
        <div class="mt-1 pl-2 flex flex-col gap-1">
            <span>AI responses are disabled in this public demo.</span>
            <span>No API requests are being sent.</span>
            <span>No tokens are consumed.</span>
        </div>
    `;
                aiMsg.firstElementChild.appendChild(tokenToggle);

            } catch (error) {
                console.error(error);

                bubble.innerHTML = `
        <span class="text-red-400">
            Unable to load demo.
        </span>
    `;
            } finally {
                sendButton.disabled = false                                         // finally always runs, error or not
            }
        }

        function getTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }

        function scrollToBottom() {
            const scroller = document.querySelector(".overflow-y-auto")
            scroller.scrollTop = scroller.scrollHeight
        }

        function showToast(message, type = "error", duration = 3000) {
            const existing = document.getElementById("toast")
            if (existing) existing.remove()

            const toast = document.createElement("div")
            toast.id = "toast"
            toast.classList.add("toast", type)
            toast.textContent = message
            document.body.appendChild(toast)

            requestAnimationFrame(() => {
                toast.classList.add("show")
            })

            setTimeout(() => {
                toast.classList.remove("show")
                setTimeout(() => toast.remove(), 300)  // wait for fade out
            }, duration)
        }

        async function restartChat() {
            await fetch("/reset", { method: "POST" })
            document.getElementById("chatWindow").innerHTML =
                `<div id="welcome-section" class="flex-1 flex flex-col items-center justify-center text-center max-w-md mx-auto gap-4">
                    <i class="fa-solid fa-robot text-6xl text-pink-300"></i>
                    <h2 class="text-2xl font-semibold">Chat-code</h2>
                    <p class="text-gray-400 text-base leading-relaxed">Hi, I'm Chat-code your personal assistant to help you understand basic programming topics. Send me a question and I'll try to explain it in really simple terms!</p>
                </div>
                `;
        }

        document.getElementById("userInput").addEventListener("input", function () {
            const sendButton = document.getElementById("sendButton")
            sendButton.disabled = !this.value.trim()
        })

        document.getElementById("userInput").addEventListener("input", function () {
            this.style.height = "auto"
            this.style.height = this.scrollHeight + "px"
        })

        document.addEventListener("keydown", function (event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault()
                sendMessage()
            }
        })        
    </script>
</body>

</html>
